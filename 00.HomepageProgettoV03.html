<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #eef1f7;
      padding: 2rem;
      color: #222;
      font-size: 0.95rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: #fff;
      padding: 2rem;
      border-radius: 14px;
      border: 1px solid #d9deea;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 2rem;
    }

    /* GRID compatta con un po' di spazio */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      column-gap: 3.5rem;
      row-gap: 1.8rem;
      justify-content: center;
      padding: 0;
    }

    /* BOX */
    .box {
      height: 160px;
      width: 165px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
      text-align: center;
      user-select: none;
      line-height: 1.4;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05);
    }

    .emoji {
      font-size: 2.3rem;
      margin-bottom: 0.8rem;
    }

    /* 🎨 COLORI CHIARI MODERNI */
    .spesa {
      background: #d9f7ec; /* menta chiarissimo */
    }
    .spesa:hover {
      background: #e8fff4;
    } 

    .viaggio {
      background: #e0f0ff; /* azzurro cielo soft */
    }
    .viaggio:hover {
      background: #eef7ff;
    }   

    .liste {
      background: #ecdfff; /* lilla chiarissimo */
    }
    .liste:hover {
      background: #f4eaff;
    } 

    .ricette {
      background: #ffe2d6; /* pesca chiaro */
    }
    .ricette:hover {
      background: #ffece3;
    } 

  </style>
</head>

<body>

  <div class="container">
    <h1>Le tue Liste</h1>

    <div class="grid">

      <div class="box spesa" onclick="vai('00a.HomeSpesa_V01.html')">
        <div class="emoji">🛒</div>
        Spesa
      </div>

      <div class="box viaggio" onclick="vai('viaggio.html')">
        <div class="emoji">✈️</div>
        Viaggio
      </div>

      <div class="box liste" onclick="vai('00.PaginaHome_Liste V08_aggiungi2.html')">
        <div class="emoji">📋</div>
        Liste
      </div>

      <div class="box ricette" onclick="vai('ricette.html')">
        <div class="emoji">🍳</div>
        Ricette
      </div>

    </div>
  </div>

  <script>
    function vai(pagina) {
      window.location.href = pagina;
    }
  </script>

</body>
</html>
