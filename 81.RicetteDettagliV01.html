<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ricetta</title>

<style>

body{
    font-family:system-ui,sans-serif;
    background:#f5f7fb;
    padding:16px;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
}

.btn-back{
    border:none;
    background:#eef2ff;
    color:#2952cc;
    padding:10px 16px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:15px;
}

.card-principale{
    background:#fff;
    border-radius:18px;
    padding:24px;
    border:1px solid #e5e7eb;
    box-shadow:0 6px 20px rgba(0,0,0,.05);
}

h1{
    text-align:center;
    margin-top:0;
    margin-bottom:10px;
    font-size:2rem;
    color:#222;
}

.badge{
    width:max-content;
    margin:auto;
    background:#e8eeff;
    color:#2d4bcc;
    padding:6px 12px;
    border-radius:999px;
    font-size: .95rem;
    font-weight:600;
    margin-bottom:20px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 2fr;
    gap:12px;
    margin-bottom:20px;
}

.info-card{
    background:#f8fbff;
    border:1px solid #d7e2ff;
    border-radius:12px;
    padding:15px;
}

.info-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
}

.info-icon{
    font-size:2.6rem;
}

.info-title{
    font-weight:700;
    color:#1d3bb8;
    font-size: 1.3rem;

}

.info-value{
    white-space:pre-line;
}

.sezione{
    margin-top:24px;
}

.sezione h2{
    color:#1d3bb8;
    margin-bottom:15px;
}

.ingredienti{
    display:grid;
    gap:10px;
}

.ingrediente{
    background:#fbfcff;
    border:1px solid #e5ebff;
    border-radius:10px;
    padding:12px;
}

.ingrediente::before{
    content:"🍴	 ";
}

.step{
    background:#f8fbff;
    border:1px solid #dbe4ff;
    border-left:6px solid #4f7cff;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.step-num{
    font-weight:700;
    color:#1d3bb8;
    margin-bottom:8px;
}

@media(max-width:700px){

.info-grid{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<button
class="btn-back"
onclick="history.back()">
← Indietro
</button>

<div class="card-principale">

<h1 id="titolo"></h1>

<div class="info-grid">

<div class="info-card">

<div class="info-header">
<div class="info-icon">👨‍👩‍👧‍👦</div>
<div class="info-title">Persone</div>
</div>

<div
id="numpersone"
class="info-value">
</div>

</div>

<div class="info-card">

<div class="info-header">
<div class="info-icon">🍳</div>
<div class="info-title">Strumenti</div>
</div>

<div
id="strumenti"
class="info-value">
</div>

</div>

</div>

<div class="sezione">

<h2>🛒 Ingredienti</h2>

<div id="ingredienti" class="ingredienti">
</div>

</div>

<div class="sezione">

<h2>👨‍🍳 Procedimento</h2>

<div id="procedimento">
</div>

</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const nomeRicetta = params.get("ricetta");

/****************************************
RICETTE
****************************************
****************************************
****************************************
****************************************
****************************************/

const RICETTE = [

	{ricetta:
		"Pizza (per Forno a Legna)",

		numpersone:"4 Persone",

		listastrumenti:`
		Ciotola
		Tagliere in legno per impastare
		4 Recipienti chiudibili
		`,

		ingredienti:`
		600gr Farina 00 (da pizza) 
		40 cl d’acqua
		10gr di sale
		Mezzo lievito (del cubetto fresco francese)

		`,

		procedimento:`
Alle 22:00:
Sciogliere il lievito nei 40 cl di acqua tiepida.
Mischiare farina e sale e lievito e acqua e impastare per 10 minuti.
<br>
Mettere poi a riposo al forno.
---
Alle 10:00 del giorno dopo:
Spargere della farina nel tavolo e metterci l’impasto.
<br>
Tagliare l’impasto in 4 panetti per metterlo in 4 recipienti.
<br>
Pesare senza tara: ogni panetto dovrebbe stare a 200 gr.
<br>
Mettere un goccio di olio in ogni recipiente prima di metterci il panetto (a verificare se utile 😊).
<br>
Fare i panetti (rigirare su loro stessi per farli diventare tondi).
<br>
Metterli nelle ciotole, chiuse. Metterle infine in frigo (a verificare se utile 😊).
---
Alle 18:00:
Spargere della farina di semola nel tavolo, stendere le pizze e condire.

		`
		}
];

/****************************************/

/****************************************/

/****************************************/

/****************************************/

const ricetta =
RICETTE.find(
r => r.ricetta === nomeRicetta
);

if(!ricetta){

document.body.innerHTML =
"<h2>Ricetta non trovata</h2>";

throw new Error();

}

document.getElementById("titolo").innerText =
ricetta.ricetta;

document.getElementById("numpersone").innerText =
ricetta.numpersone;

document.getElementById("strumenti").innerText =
ricetta.listastrumenti.trim();

const ingredientiDiv =
document.getElementById("ingredienti");

ricetta.ingredienti
.trim()
.split("\n")
.forEach(i=>{

if(!i.trim()) return;

ingredientiDiv.innerHTML +=
`<div class="ingrediente">${i}</div>`;

});

const procedimentoDiv =
document.getElementById("procedimento");

const stepList =
ricetta.procedimento.split("---");

stepList.forEach((step,index)=>{

procedimentoDiv.innerHTML += `
<div class="step">
<div class="step-num">
STEP ${index+1}
</div>
${step}
</div>
`;

});

</script>

</body>
</html>
